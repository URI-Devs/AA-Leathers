<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — AA Leathers</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600;700&family=Montserrat:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-wrap" style="padding-top:80px">
  <div class="auth-card">
    <div class="auth-logo">AA<span> Leathers</span></div>
    <div class="auth-tagline">Choose a new password</div>
    <div class="f-grp">
      <label class="f-lbl" for="newPassword">New Password</label>
      <input class="f-inp" id="newPassword" type="password" minlength="8" autocomplete="new-password">
      <div class="password-actions"><button type="button" class="show-password-btn" onclick="togglePassword('newPassword', this)">Show password</button></div>
    </div>
    <div class="f-grp">
      <label class="f-lbl" for="confirmPassword">Confirm Password</label>
      <input class="f-inp" id="confirmPassword" type="password" minlength="8" autocomplete="new-password">
      <div class="password-actions"><button type="button" class="show-password-btn" onclick="togglePassword('confirmPassword', this)">Show password</button></div>
    </div>
    <div class="f-err" id="resetError"></div>
    <button class="f-btn" type="button" id="resetButton">Update Password</button>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/data.js"></script>
<script src="js/ui.js"></script>
<script>
document.getElementById('resetButton').addEventListener('click', async () => {
  const password = document.getElementById('newPassword').value;
  const confirm = document.getElementById('confirmPassword').value;
  const error = document.getElementById('resetError');
  if (password.length < 8 || password !== confirm) {
    error.textContent = password.length < 8 ? 'Password must be at least 8 characters.' : 'Passwords do not match.';
    return;
  }
  const result = await sb.auth.updateUser({ password });
  if (result.error) { error.textContent = result.error.message; return; }
  toast('Password updated. You can now log in.', 'success');
  setTimeout(() => { location.href = 'login.html'; }, 800);
});
</script>
</body>
</html>
